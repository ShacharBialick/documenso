name: Build OSCo Image

# White-label build for the theoscompany.co.uk fork. Publishes a linux/amd64
# image to ghcr.io/shacharbialick/documenso so sign.theoscompany.com has a
# pullable image without depending on upstream Documenso's registry.
#
# Deliberately narrower than upstream's .github/workflows/publish.yml:
#   - single platform (linux/amd64) instead of the amd64+arm64 matrix, since
#     the deployment target is amd64-only and this halves build time
#   - pushes only to ghcr.io (no DockerHub) using the ambient GITHUB_TOKEN,
#     so no extra registry secrets are needed on the fork
#   - fixed tags instead of deriving the version from git tags, since this
#     fork does not cut upstream-style release tags

on:
  workflow_dispatch:
  push:
    branches: ['feat/white-label']

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PRIVATE_TELEMETRY_KEY=
            NEXT_PRIVATE_TELEMETRY_HOST=
          tags: |
            ghcr.io/shacharbialick/documenso:v2.17.0-osco.1
            ghcr.io/shacharbialick/documenso:osco-latest
